<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

    <!-- Barra de Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('solicitud.registrar') }}">
                📋 Sistema de Solicitudes
            </a>
            <div class="d-flex align-items-center">
                {% if session.get('rol') == 'admin' %}
                    <span class="text-white small me-3">👤 {{ session.get('nombre') }}</span>
                    <a href="{{ url_for('solicitud.panel_solicitudes') }}" class="btn btn-light btn-sm me-2 fw-semibold">
                        📊 Panel
                    </a>
                    
                    <a href="{{ url_for('export.exportar_excel') }}" class="btn btn-success btn-sm me-2">
                        📥 Excel
                    </a>
                    <a href="{{ url_for('solicitud.logout') }}" class="btn btn-outline-light btn-sm">
                        Salir
                    </a>
                {% else %}
                    <a href="{{ url_for('solicitud.login') }}" class="btn btn-outline-light btn-sm fw-semibold">
                        🔒 Acceso Administrador
                    </a>
                    <a href="{{ url_for('solicitud.consultar_estado') }}" class="btn btn-outline-light btn-sm me-2">
                        🔍 Consultar Estado
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
