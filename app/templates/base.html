<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Solicitudes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Sistema de Solicitudes</span>
            <a href="{{ url_for('export.exportar_excel') }}" class="btn btn-outline-success btn-sm">
                Descargar Excel
            </a>
        </div>
    </nav>
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <!-- Script de Bootstrap necesario para el colapso/despliegue -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
